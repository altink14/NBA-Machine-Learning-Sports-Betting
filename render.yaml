# Render blueprint.
# WARNING (2026-09-22): this targets the free plan, which has no persistent
# disk and sleeps after 15 idle minutes, so bootstrap_db.py re-downloads the
# whole snapshot on every wake. That was tolerable when the snapshot was
# 47 MB. TeamData.sqlite is now 2.93 GB and the published snapshot is a
# 349 MB archive from 9 August that predates the served model's supporting
# data. Re-publish the snapshot (DEPLOY.md section 3) and move to a plan
# with a >=4 GB volume before treating this file as a working deployment.
services:
  - type: web
    name: bettingbuddy-api
    runtime: docker
    plan: free
    branch: bettingbuddy2.0
    healthCheckPath: /health
    envVars:
      - key: DB_SNAPSHOT_URL
        value: https://github.com/altink14/NBA-Machine-Learning-Sports-Betting/releases/download/db-snapshot-v1/db-snapshot.tar.gz
      - key: PORT
        value: "8000"
      - key: DEFAULT_SPORTSBOOK
        value: fanduel
      # Pay the ~1-2 minute model load at boot rather than on the first
      # prediction request, which a gateway would time out first.
      - key: WARM_MODEL_ON_START
        value: "true"
      # The laptop is the ledger's writer (DEPLOY.md section 3a). A visit to
      # /predictions here must not start a second, ungraded ledger.
      - key: LOG_PREDICTIONS_ON_REQUEST
        value: "false"
      # Set CORS_ORIGINS to your Vercel URL in the Render dashboard after
      # the frontend deploys, e.g. https://bettingbuddy.vercel.app
